<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Prévia do mapa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #msg { position: fixed; left: 12px; bottom: 10px; color: #fff; font-size: 13px; opacity: .85; text-shadow: 0 1px 3px #000; }
    body.ui0 #msg { display: none; }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="msg">Montando o mapa…</div>
  <script>if (new URLSearchParams(location.search).get('ui') === '0') document.body.classList.add('ui0');</script>
  <script type="module" src="src/preview.js"></script>
</body>
</html>
