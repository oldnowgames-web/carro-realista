<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Garagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/options.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>

  <aside id="panel">
    <h1 data-i18n="garage">Garagem</h1>
    <section>
      <h2 data-i18n="car">Carro</h2>
      <div id="cars" class="list"></div>
    </section>
    <section>
      <h2><span data-i18n="color">Cor</span> <span id="colorName" class="muted"></span></h2>
      <div id="swatches" class="swatches"></div>
      <label class="custom"><span data-i18n="otherColor">Outra cor</span> <input type="color" id="customColor" value="#b3121b"></label>
    </section>
    <section>
      <h2 data-i18n="finish">Acabamento</h2>
      <div id="finishes" class="seg"></div>
    </section>
    <section>
      <h2 data-i18n="demo">Demonstração</h2>
      <div class="toggles">
        <button id="tHead" class="tog" aria-pressed="false"><span data-i18n="headlights">Faróis</span> <kbd>H</kbd></button>
        <button id="tBrake" class="tog" aria-pressed="false"><span data-i18n="brake">Freio</span> <kbd>B</kbd></button>
        <button id="tRoll" class="tog" aria-pressed="true"><span data-i18n="spin">Rodar</span> <kbd>Espaço</kbd></button>
      </div>
    </section>
    <div class="ready">
      <a class="btn" href="index.html" data-i18n="back">Voltar</a>
      <button id="opt" class="optbtn" data-i18n="options">Opções</button>
      <button id="ready" class="pri" data-i18n="ready">Pronto</button>
    </div>
  </aside>

  <div id="player"></div>
  <div id="specs"></div>
  <div id="hint" data-i18n="dragHint">Arraste para girar · roda do mouse para aproximar</div>
  <div id="stats" hidden></div>
  <div id="loading"><span id="loadText">Carregando…</span></div>

  <script type="module" src="src/main.js"></script>
  <script type="module">
    import { S, t, applyI18n } from './src/settings.js';
    import { openOptions } from './src/optionsUI.js';
    import { initUiAudio } from './src/uiaudio.js';
    import { initMusic } from './src/music.js';
    import { mountMiniPlayer, bindMusicKeys } from './src/musicUI.js';
    const $ = (id) => document.getElementById(id);
    applyI18n(); initUiAudio(); initMusic('menu'); mountMiniPlayer($('player')); bindMusicKeys();
    $('opt').onclick = openOptions;
    $('ready').onclick = () => { location.href = 'modo.html'; };
    addEventListener('keydown', (e) => { if (e.code === 'Enter' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') $('ready').click(); });
  </script>
</body>
</html>
